<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoLang Store screenshots</title>
<!-- Source of the Microsoft Store screenshots (1366x768). render-screenshots.ps1 opens this page once per language and
     slide (?lang=xx#1 .. #4) in headless Edge. The words come from screenshot-strings.js; ui/<lang>-*.png are AutoLang's
     own windows in that language, drawn off-screen by tools/AutoLang.Screens. -->
<style>
  :root { --ink: #1b1d1a; --muted: #5d625a; --line: #e3e5de; --accent: #1f8a4c; --soft: #e4f3e9; --wrong: #b4442f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1366px; height: 768px; overflow: hidden; }
  body {
    font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; color: var(--ink);
    background: radial-gradient(1200px 700px at 85% 30%, #e4f3e9 0%, #f6f7f2 55%, #f3f4ee 100%);
  }
  .slide { display: none; height: 100%; grid-template-columns: 520px 1fr; gap: 40px; align-items: center; padding: 0 72px; }
  .slide.on { display: grid; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 650; font-size: 22px; margin-bottom: 36px; }
  .brand img { width: 40px; height: 40px; border-radius: 9px; }
  h1 { font-size: 50px; line-height: 1.08; letter-spacing: -.02em; margin: 0 0 22px; font-weight: 700; }
  p.sub { font-size: 22px; line-height: 1.5; color: var(--muted); margin: 0; }
  kbd { font: 600 .85em "Segoe UI", sans-serif; border: 1px solid #cfd3c8; border-bottom-width: 3px; border-radius: 6px; padding: 1px 8px; background: #fff; color: var(--ink); }
  .visual { display: flex; justify-content: center; align-items: center; }
  .shot { box-shadow: 0 2px 6px rgba(20,24,18,.12), 0 24px 60px rgba(20,24,18,.18); border-radius: 8px; overflow: hidden; line-height: 0; }
  .shot.menu { border-radius: 4px; }
  /* The window's own caption, as Windows 11 draws it (the off-screen capture has the client area only). */
  .shot.win { background: #f0f0f0; outline: 1px solid rgba(0,0,0,.12); }
  .caption { height: 32px; background: #fff; display: flex; align-items: center; justify-content: space-between; line-height: 1;
    font: 12px "Segoe UI", sans-serif; color: #1b1b1b; padding-inline-start: 12px; }
  .caption .x { width: 46px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 11px; }

  /* slide 1: an editor before and after */
  .editor { width: 640px; background: #fff; border-radius: 10px; box-shadow: 0 2px 6px rgba(20,24,18,.12), 0 24px 60px rgba(20,24,18,.18); overflow: hidden; }
  .editor .bar { height: 40px; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 16px; font: 14px "Segoe UI", sans-serif; color: var(--muted); justify-content: space-between; }
  .pill { font: 600 13px/1 Consolas, monospace; padding: 6px 9px; border-radius: 6px; background: var(--accent); color: #fff; }
  .rows { padding: 14px 28px 22px; }
  .row { display: grid; grid-template-columns: 1fr 40px 1fr; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); font: 34px "Segoe UI", sans-serif; }
  .row:last-child { border-bottom: 0; }
  .row .from { color: var(--wrong); text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: rgba(180,68,47,.45); }
  .row .to { color: var(--accent); font-weight: 600; }
  .row .arrow { color: #9aa094; font-size: 26px; text-align: center; }
  .label { display: grid; grid-template-columns: 1fr 40px 1fr; font: 600 13px "Segoe UI", sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 0 2px; }

  /* slide 2: the tray menu above its icon */
  .tray { display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
  .taskbar { width: 420px; height: 52px; border-radius: 10px; background: rgba(255,255,255,.85); box-shadow: 0 8px 30px rgba(20,24,18,.12); display: flex; align-items: center; justify-content: flex-end; gap: 18px; padding: 0 20px; font: 14px "Segoe UI", sans-serif; color: var(--muted); }
  .taskbar img { width: 24px; height: 24px; border-radius: 5px; outline: 2px solid var(--accent); outline-offset: 4px; }

  /* slide 4: the privacy checklist */
  .checks { list-style: none; margin: 0; padding: 32px 36px; background: #fff; border-radius: 14px; width: 640px; box-shadow: 0 2px 6px rgba(20,24,18,.08), 0 24px 60px rgba(20,24,18,.12); }
  .checks li { position: relative; padding: 13px 0; padding-inline-start: 40px; font-size: 21px; line-height: 1.4; border-bottom: 1px solid var(--line); }
  .checks li:last-child { border-bottom: 0; }
  .checks li::before { content: ""; position: absolute; inset-inline-start: 0; top: 18px; width: 22px; height: 22px; border-radius: 50%; background: var(--soft); box-shadow: inset 0 0 0 7px var(--accent); }
  .checks b { font-weight: 650; }

  /* Arabic script joins letters, so no tracking; Hebrew and Arabic have no capitals to force. */
  html[dir=rtl] h1, html[dir=rtl] .label { letter-spacing: 0; text-transform: none; }
  /* The editor mock is a left-to-right strip of mixed scripts in every language. */
  .editor { direction: ltr; }
  .label span, .editor .bar span { unicode-bidi: plaintext; text-align: left; }
</style>
</head>
<body>

<section class="slide" id="s1">
  <div>
    <div class="brand"><img src="../../docs/icon.png" alt="">AutoLang</div>
    <h1 data-h="0"></h1>
    <p class="sub" data-s="0"></p>
  </div>
  <div class="visual">
    <div class="editor">
      <div class="bar"><span data-t="any"></span><span class="pill">ENG ⇄ HEB</span></div>
      <div class="rows">
        <div class="label"><span data-t="typed"></span><span></span><span data-t="wrote"></span></div>
        <div class="row"><span class="from">akuo</span><span class="arrow">→</span><span class="to" dir="rtl" style="text-align:left">שלום</span></div>
        <div class="row"><span class="from" dir="rtl" style="text-align:left">יקךךם</span><span class="arrow">→</span><span class="to">hello</span></div>
        <div class="row"><span class="from">ghbdtn</span><span class="arrow">→</span><span class="to">привет</span></div>
        <div class="row"><span class="from">kalhmera</span><span class="arrow">→</span><span class="to">καλημερα</span></div>
      </div>
    </div>
  </div>
</section>

<section class="slide" id="s2">
  <div>
    <div class="brand"><img src="../../docs/icon.png" alt="">AutoLang</div>
    <h1 data-h="1"></h1>
    <p class="sub" data-s="1"></p>
  </div>
  <div class="visual">
    <div class="tray">
      <div class="shot menu"><img data-ui="tray-menu" alt="AutoLang tray menu"></div>
      <div class="taskbar"><span>ENG</span><span>12:30</span><img src="../../docs/icon.png" alt=""></div>
    </div>
  </div>
</section>

<section class="slide" id="s3">
  <div>
    <div class="brand"><img src="../../docs/icon.png" alt="">AutoLang</div>
    <h1 data-h="2"></h1>
    <p class="sub" data-s="2"></p>
  </div>
  <div class="visual">
    <div class="shot win">
      <div class="caption"><span data-t="caption"></span><span class="x">✕</span></div>
      <img data-ui="languages" alt="AutoLang Languages window">
    </div>
  </div>
</section>

<section class="slide" id="s4">
  <div>
    <div class="brand"><img src="../../docs/icon.png" alt="">AutoLang</div>
    <h1 data-h="3"></h1>
    <p class="sub" data-s="3"></p>
  </div>
  <div class="visual">
    <ul class="checks"></ul>
  </div>
</section>

<script src="screenshot-strings.js"></script>
<script>
  var lang = (location.search.match(/[?&]lang=([a-z]+)/) || [0, 'en'])[1];
  var T = STRINGS[lang] || STRINGS.en;
  var n = (location.hash || '#1').slice(1);
  var slide = document.getElementById('s' + n);
  var q = function (sel) { return Array.prototype.slice.call(slide.querySelectorAll(sel)); };

  document.documentElement.lang = lang;
  document.documentElement.dir = T.dir;
  q('[data-h]').forEach(function (e) { e.textContent = T.h[e.dataset.h]; });
  q('[data-s]').forEach(function (e) { e.innerHTML = T.s[e.dataset.s]; });
  q('[data-t]').forEach(function (e) { e.textContent = T[e.dataset.t]; });
  q('[data-ui]').forEach(function (e) { e.src = 'ui/' + lang + '-' + e.dataset.ui + '.png'; });
  q('.checks').forEach(function (ul) { ul.innerHTML = T.checks.map(function (c) { return '<li>' + c + '</li>'; }).join(''); });
  slide.classList.add('on');

  // Long translations: shrink the headline, then the sub line, until the text column fits the slide.
  var col = slide.firstElementChild, h1 = col.querySelector('h1'), sub = col.querySelector('.sub');
  for (var px = 50; px > 32 && h1.scrollHeight > px * 1.08 * 3.2; px -= 2) h1.style.fontSize = px + 'px';
  for (var sp = 22; sp > 17 && col.scrollHeight > 640; sp -= 1) sub.style.fontSize = sp + 'px';
</script>
</body>
</html>
